services:

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenforecast-backend
    restart: always
    # Secrets stay in backend/.env (ignored by Git and excluded from the image).
    env_file:
      - ./backend/.env
    environment:
      OPEN_METEO_BASE_URL: https://api.open-meteo.com/v1
      CORS_ORIGINS: '["http://localhost:3000", "http://frontend:3000"]'
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data/uploads:/app/data/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: greenforecast-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"

