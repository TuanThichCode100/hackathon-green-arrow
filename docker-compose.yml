version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: greenforecast-db
    restart: always
    environment:
      POSTGRES_USER: greenforecast
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: greenforecast_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: greenforecast-backend
    restart: always
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgresql://greenforecast:password123@db:5432/greenforecast_db
      - OPEN_METEO_BASE_URL=https://api.open-meteo.com/v1
      - CORS_ORIGINS=["http://localhost:3000", "http://frontend:3000"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data/uploads:/app/data/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: greenforecast-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  pgdata:
